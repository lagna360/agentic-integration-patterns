spring:
  application:
    name: chapter-04-first-route
  datasource:
    url: jdbc:h2:mem:orderdesk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

camel:
  main:
    name: chapter-04-order-desk
  springboot:
    main-run-controller: true

orderdesk:
  parallel:
    timeout-ms: 250
  kafka:
    enabled: false
    brokers: localhost:9092
    command-topic: orderdesk.investigation.commands.v1
    admission-group: orderdesk-investigation-admission-v1
    authenticated-producer-ref: workload:order-exception-case-manager
  routes:
    input-uri: direct:inventory-shortfall
    proposed-uri: seda:resolution-proposed
    manual-review-uri: seda:manual-review
    invalid-uri: seda:invalid-message
    assessment-failed-uri: seda:assessment-failed
